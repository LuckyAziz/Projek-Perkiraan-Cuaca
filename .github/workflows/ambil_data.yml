name: Ambil data BMKG

on:
  schedule:
    - cron: "15 */6 * * *"   # tiap 6 jam, pukul xx:15 UTC
  workflow_dispatch:          # tombol untuk menjalankan manual

permissions:
  contents: write

jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ambil_data.py
      - name: Simpan perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
